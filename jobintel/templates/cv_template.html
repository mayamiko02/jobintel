<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: {{ACCENT_COLOR}};
    --dark: {{DARK_COLOR}};
    --ink: #22252A;
    --muted: #525860;
    --rule: #D8E0E8;
  }
  body {
    font-family: 'Source Sans 3', 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif;
    color: var(--ink);
    width: 210mm;
    min-height: 297mm;
    position: relative;
    font-size: 9.2pt;
    line-height: 1.32;
    background: #FFFFFF;
  }
  .top-bar { height: 7mm; background: var(--accent); width: 100%; }
  .bottom-bar { height: 4.5mm; background: var(--dark); width: 100%; position: fixed; bottom: 0; left: 0; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8mm 14mm 4.5mm 14mm;
    border-bottom: 1.2pt solid var(--accent);
  }
  .header-left { max-width: 142mm; }
  .name { font-size: 20pt; font-weight: 700; letter-spacing: 0.4pt; color: var(--dark); line-height: 1.08; }
  .headline { font-size: 10.5pt; font-weight: 600; color: #2D5A7B; margin-top: 1.2mm; }
  .contact { font-size: 8.4pt; color: var(--muted); margin-top: 2mm; }
  .avatar { width: 24mm; height: 24mm; border-radius: 50%; object-fit: cover; border: 1.5pt solid var(--accent); }
  .grid { display: flex; padding: 4.5mm 14mm 10mm 14mm; gap: 7mm; }
  .col-left { width: 35%; border-right: 0.8pt solid var(--rule); padding-right: 5mm; }
  .col-right { width: 65%; }
  .section { margin-bottom: 3.8mm; }
  .section-title {
    font-size: 9pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7pt;
    color: var(--dark);
    border-bottom: 1.4pt solid var(--accent);
    padding-bottom: 0.8mm;
    margin-bottom: 2mm;
  }
  .summary { font-size: 8.8pt; color: var(--ink); line-height: 1.34; }
  .item { margin-bottom: 2.6mm; }
  .role-line { font-weight: 700; font-size: 9.2pt; color: var(--dark); }
  .meta-line { font-size: 8.1pt; color: var(--muted); margin-bottom: 0.9mm; }
  ul.bullets { margin-left: 3.6mm; }
  ul.bullets li { margin-bottom: 0.7mm; font-size: 8.6pt; line-height: 1.28; }
  .skill-tag { font-size: 8.5pt; margin-bottom: 1mm; }
  .edu-item { margin-bottom: 2mm; font-size: 8.4pt; }
  .edu-title { font-weight: 700; color: var(--dark); }
  .qr-box { margin-top: 2.5mm; text-align: left; }
  .qr-box img { width: 17mm; height: 17mm; }
  .qr-label { font-size: 7.4pt; color: var(--muted); }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="header">
    <div class="header-left">
      <div class="name">{{FULL_NAME}}</div>
      <div class="headline">{{HEADLINE}}</div>
      <div class="contact">{{CONTACT_LINE}}</div>
    </div>
    {{AVATAR_HTML}}
  </div>
  <div class="grid">
    <div class="col-left">
      <div class="section">
        <div class="section-title">Profile</div>
        <div class="summary">{{SUMMARY_TEXT}}</div>
      </div>
      <div class="section">
        <div class="section-title">Core Skills</div>
        {{SKILLS_HTML}}
      </div>
      <div class="section">
        <div class="section-title">Education & Credentials</div>
        {{EDUCATION_HTML}}
      </div>
      <div class="section">
        <div class="section-title">Languages</div>
        {{LANGUAGES_HTML}}
      </div>
      {{QR_HTML}}
    </div>
    <div class="col-right">
      <div class="section">
        <div class="section-title">Experience</div>
        {{EXPERIENCE_HTML}}
      </div>
      {{CERTIFICATES_SECTION_HTML}}
    </div>
  </div>
  <div class="bottom-bar"></div>
</body>
</html>
